[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "embedded-uart-frame-toolkit"
version = "0.1.0"
description = "Dependency-light encoder and decoder for simple embedded UART frames."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "CA" }
]
keywords = ["embedded", "uart", "protocol", "firmware", "qa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
uart-frame = "uart_frame_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
