name: test

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Run CLI smoke checks
        run: |
          uart-frame encode --cmd 0x22 --payload "01 02 03"
          uart-frame decode "55 AA 22 03 01 02 03 2B"
          uart-frame render-profile examples/public-profile.json
          uart-frame smoke-test --dry-run --cmd 0x42
